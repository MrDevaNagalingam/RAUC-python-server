[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phytec-ota-server"
version = "0.2.0"
description = "OTA management server for unchanged hawkBit DDI and RAUC targets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1", "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
ota = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = ["updater: executes an actual separately supplied v1.3 updater binary"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
